[tool.poetry]
name = "casper"
version = "0.1.0"
description = "CASPER: cold-start conversational recommender (research repo)"
authors = ["Aleksandra Makarova <a.makarova@pgr.reading.ac.uk>"]
readme = "README.md"
package-mode = false  # research repo, not a distributable package

[tool.poetry.dependencies]
python = "^3.9"
torch = {version = "~2.2.0", source = "pytorch"}  # 2.2.0 stable on Windows CPU
transformers = "^4.35.0"
sentence-transformers = "^2.2.2"
openai = "^1.3.0"
pandas = "^2.1.0"
numpy = "^1.24.0"
scipy = "^1.11.0"
matplotlib = "^3.7.0"
scikit-learn = "^1.3.0"
python-dotenv = "^1.0.0"
tqdm = "^4.66.0"
flask = "^3.0.0"
flask-cors = "^4.0.0"
pyyaml = "^6.0.0"
jinja2 = "^3.1.0"
faiss-cpu = "^1.7.4"
implicit = "^0.7.3"  # iALS/WMF baseline (scripts/baselines/ials.py); wheels on Windows CPU
plotly = "^5.17.0"
nest-asyncio = "^1.6.0"

[tool.poetry.group.dev.dependencies]
black = "^23.9.0"
flake8 = "^6.1.0"
pytest = "^7.4.0"
ipykernel = "^6.25.0"
pre-commit = "^3.5.0"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]